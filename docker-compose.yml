services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: guide_backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - guide_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./front/website
      dockerfile: Dockerfile
    container_name: guide_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - guide_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: guide_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - guide_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: guide_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - guide_network
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=postgres

networks:
  guide_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local