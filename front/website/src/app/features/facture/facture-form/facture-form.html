<section class="max-w-xl mx-auto px-6 py-10">
  <h1 class="font-display text-2xl font-semibold text-ink-900 tracking-tight mb-8">
    Convertir le devis en facture
  </h1>

  @if (isLoading()) {
    <p class="text-ink-600 text-sm">Chargement…</p>
  }

  @if (errorMessage()) {
    <p class="text-sm text-red-600 mb-4">{{ errorMessage() }}</p>
  }

  @if (devis() && !isLoading()) {
    <div class="bg-white border border-ink-200 rounded-xl p-6 space-y-4">
      <div class="border-b border-ink-100 pb-4">
        <p class="text-sm text-ink-600">Devis</p>
        <p class="font-medium text-ink-900">{{ devis()!.numero }} — {{ devis()!.clientNom }}</p>
        <p class="text-sm text-ink-600 mt-1">{{ devis()!.montantHT }} € HT</p>
      </div>

      <label class="block">
        <span class="block text-sm font-medium text-ink-900 mb-1.5">Date d'échéance de paiement</span>
        <input
          type="date"
          [value]="dateEcheance()"
          (input)="dateEcheance.set($any($event.target).value)"
          class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent"
        />
      </label>

      <div class="flex items-center gap-3 pt-2">
        <app-button variant="primary" (clicked)="confirm()">
          Générer la facture
        </app-button>
        <a routerLink="/devis" class="text-sm font-medium text-ink-600 hover:text-ink-900">Annuler</a>
      </div>
    </div>
  }
</section>
