

<section class="max-w-xl mx-auto px-6 py-10">
  <h1 class="font-display text-2xl font-semibold text-ink-900 tracking-tight mb-8">
    {{ isEditMode() ? 'Modifier le devis' : 'Nouveau devis' }}
  </h1>

  <form (ngSubmit)="submit()" class="bg-white border border-ink-200 rounded-xl p-6 space-y-4">
    <app-input label="Nom du client" placeholder="Ex : Dupont SARL" [value]="clientNom()" (valueChange)="clientNom.set($event)" />

    <app-input label="Montant HT (€)" type="number" placeholder="0.00" [value]="montantHT()" (valueChange)="montantHT.set($event)" />

    <label class="block">
      <span class="block text-sm font-medium text-ink-900 mb-1.5">Statut</span>
      <select
        [value]="statut()"
        (change)="statut.set($any($event.target).value)"
        class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent"
      >
        @for (s of statuts; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </label>

    <label class="block">
      <span class="block text-sm font-medium text-ink-900 mb-1.5">Date de validité</span>
      <input
        type="date"
        [value]="dateValidite()"
        (input)="dateValidite.set($any($event.target).value)"
        class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm text-ink-900 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent"
      />
    </label>

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <div class="flex items-center gap-3 pt-2">
      <app-button type="submit" variant="primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Enregistrement…' : 'Enregistrer' }}
      </app-button>
      <a routerLink="/devis" class="text-sm font-medium text-ink-600 hover:text-ink-900">
        Annuler
      </a>
    </div>
  </form>
</section>
