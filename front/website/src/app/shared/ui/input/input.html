<!-- shared/ui/input/input.html -->
<label class="block">
  @if (label()) {
    <span class="block text-sm font-medium text-ink-900 mb-1.5">{{ label() }}</span>
  }
  <input
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    (input)="value.set($any($event.target).value)"
    class="w-full border rounded-lg px-3 py-2 text-sm text-ink-900 placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent"
    [class]="error() ? 'border-red-300' : 'border-ink-200'"
  />
  @if (error()) {
    <span class="block text-xs text-red-600 mt-1">{{ error() }}</span>
  }
</label>
